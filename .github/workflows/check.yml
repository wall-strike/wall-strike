name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # files exist, no unused assets, sw.js up to date, item tables and case economy sane
      - run: node tools/check.mjs
